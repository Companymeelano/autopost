name: Android APK (Capacitor)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'در صورت پرکردن، APK روی Release همان تگ هم آپلود می‌شود (مثلاً v1.0-android)'
        required: false
        type: string
  push:
    tags: ['*-android']

jobs:
  apk:
    name: build debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: install + web build
        run: |
          npm ci
          npm run build

      - name: capacitor android project
        run: |
          npx cap add android
          npx cap sync android

      - name: stamp version
        working-directory: android
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          [ -z "$TAG" ] && TAG="v0.0-dev"
          VERSION="${TAG#v}"
          sed -i "s/versionCode .*/versionCode ${GITHUB_RUN_NUMBER}/" app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: gradle assembleDebug
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: collect APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk panahfit.apk
          ls -lah panahfit.apk
          sha256sum panahfit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: panahfit-apk
          path: panahfit.apk

      - name: attach to GitHub Release
        if: ${{ github.event.inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" panahfit.apk --clobber
          else
            gh release create "$TAG" panahfit.apk --title "پناه‌فیت اندروید $TAG" --notes "APK نسخه debug — اپ PWA/CMS پناه‌فیت (Capacitor). پس از نصب، آدرس سرور پناه‌فیت خود را در صفحه اول وارد کنید."
          fi
