name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit & integration tests (with coverage gate)
        run: npx vitest run --coverage.enabled
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  e2e:
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run e2e (server boots via playwright webServer)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  docker:
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - uses: actions/checkout@v4
      - name: Build image (smoke)
        run: docker build -t panahfit-cms:ci .
      - name: Container healthcheck smoke
        run: |
          docker run -d --name pf -p 8787:8787 panahfit-cms:ci
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8787/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8787/api/health | grep -q '"ok":true'
          docker rm -f pf
